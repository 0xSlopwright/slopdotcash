name = "slop-notify"
main = "index.ts"
compatibility_date = "2026-07-30"
workers_dev = false
preview_urls = false

# No routes: the Pages app reaches this Worker only through the SLOP_NOTIFY
# service binding at https://notify.internal.

[vars]
NOTIFY_FROM_ADDRESS = "notifications@slop.cash"

# Admin recipients come from ADMIN_EMAILS. Explicit mail pilots use their
# separate operator-verified recipient secrets. All addresses stay outside git;
# callers cannot supply a destination. The default profile has no mail pilot.
[[send_email]]
name = "ADMIN_EMAIL"

[observability]
enabled = true

  [observability.logs]
  invocation_logs = false

# Default releases have no pilot schedule. scripts/release-notify.mjs adds
# the selected environment D1 binding and schedule only for an explicit pilot.
[triggers]
crons = []
