name = "slop-notify"
main = "index.ts"
compatibility_date = "2026-07-30"
workers_dev = false
preview_urls = false

# No routes: the Pages app reaches this Worker only through the SLOP_NOTIFY
# service binding at https://notify.internal.

[vars]
NOTIFY_FROM_ADDRESS = "notifications@slop.cash"

# Recipients come only from the ADMIN_EMAILS secret, set outside the
# repository with `wrangler secret put ADMIN_EMAILS`. Callers cannot supply a
# recipient, so this binding sends only to that configured list.
[[send_email]]
name = "ADMIN_EMAIL"

[observability]
enabled = true

  [observability.logs]
  invocation_logs = false
