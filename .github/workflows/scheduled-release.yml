name: Scheduled release

# GitHub runs schedules only on the default branch (development), so a cron
# trigger in deploy.yml can never publish production. This workflow dispatches
# deploy.yml on main and development instead. Each dispatched run ingests the
# current D1 registry and live GitHub activity, passes the full quality gate,
# and publishes through the normal release job of its branch: main through
# eliza-army-production, development through slop-staging. A project that an
# admin activates in D1 thus gets its leaderboard, points, and profiles on the
# next run without a commit.

on:
  schedule:
    # Offset from the hour so this run does not join the top-of-hour surge.
    - cron: "17 */6 * * *"
  workflow_dispatch:

concurrency:
  group: slop-scheduled-release
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch deploy.yml on main and development
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A dispatch from GITHUB_TOKEN starts a run; other GITHUB_TOKEN
          # events do not. Dispatch both branches before failing on either.
          status=0
          for ref in main development; do
            # A queued run cancels an older pending run in the slop-production
            # lock, so never queue a scheduled run behind an active one.
            active="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml --branch "$ref" \
              --json status --jq '[.[] | select(.status != "completed")] | length')"
            if [ "$active" -ne 0 ]; then
              echo "deploy.yml is already active on $ref; skipping."
              continue
            fi
            if gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref "$ref"; then
              echo "Dispatched deploy.yml on $ref."
            else
              echo "::error::Could not dispatch deploy.yml on $ref."
              status=1
            fi
          done
          exit "$status"
