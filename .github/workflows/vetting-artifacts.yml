name: Isolated vetting artifact workflow

on:
  pull_request:
    branches: [development, main]
    paths:
      - 'workers/vetting/**'
      - '.github/workflows/vetting-artifacts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artifact-workflow:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install the distribution sandbox and namespace policy
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap apparmor-profiles openssl iproute2
          sudo apparmor_parser -r /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
      - name: Run harmless artifact and isolation workflows
        run: python3 workers/vetting/artifacts_workflow_test.py
      - name: Compare exact Git source and release archives in isolation
        run: python3 workers/vetting/provenance_workflow_test.py
      - name: Run private DNS and HTTPS dependency capture workflows
        run: sudo unshare --mount --net --fork python3 workers/vetting/dependencies_workflow_test.py
      - name: Capture actual filesystem changes and refuse unsafe entries
        run: python3 workers/vetting/filesystem_workflow_test.py
